name: qa-langfuse
x-app-env: &app-env
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3000
  SALT: ${SALT}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
x-dependencies: &dependencies
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  clickhouse: { condition: service_healthy }
  minio: { condition: service_healthy }
services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *dependencies
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 1200m
    environment:
      <<: *app-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: qa-plateforme
      LANGFUSE_INIT_ORG_NAME: QA Plateforme
      LANGFUSE_INIT_PROJECT_ID: playwright-bdd
      LANGFUSE_INIT_PROJECT_NAME: Playwright BDD Agents
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: qa-admin@localhost.test
      LANGFUSE_INIT_USER_NAME: QA Admin
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_DISABLE_SIGNUP: "true"
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: *dependencies
    mem_limit: 768m
    environment: *app-env
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/qa-limits.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 40
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres:
  redis:
  clickhouse:
  minio:
